<!DOCTYPE html>
<html>
    <link rel="stylesheet" href="style.css">
    <head>
        <title>Vehicle booking form</title>
    </head>
    <body>
        <h1>Vehicle Booking form</h1>
        
    <label for="clientname">Client name:</label>
    <input type="text" id="clientname" required>
    <br>
    <br>
    <label>Vehicle type</label>
        <select>
            <option>Car</option>
            <option>Van</option>
            <option>Bus</option>
        </select> 
        <br>
        <br>
    <label for="startdate">Start Date</label>   
    <input id="startdate" type ="date">
    <br>
    <br>
    <label for="enddate">End Date</label>
    <input id="enddate" type ="date">
    <br>
    <br>
    <label for="dailyrate">Daily rate</label>
    <input id="dailyrate" type="number" min="0">
    <br>
    <br>
    <input type="radio" name="status" value="Tentative">
    <label>Tentative</label>
    <input type="radio" name="status" value="Confirmed">
    <label>Confirmed</label>
    <br>
    <br>
    <textarea maxlength="200"></textarea>
    <button type="Submit">Save Booking</button>
    <br>
    <br>
    <table>
        <thead>
            <tr>
                <th>Client Name</th>
                <th>Vehicle Type</th>
                <th>Start Date</th>
                <th>End Date</th>
                <th>Daily Rate</th>
                <th>Status</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>ABC Company</td>
                <td>Car</td>
                <td>2023-10-01</td>
                <td>2023-10-05</td>
                <td>50.00</td>
                <td>Confirmed</td>
            </tr>
            <tr>
                <td>XYZ Company</td>
                <td>Van</td>
                <td>2023-10-10</td>
                <td>2023-10-15</td>
                <td>75.00</td>
                <td>Tentative</td>
            </tr>
        </tbody>
    </table>
    </body>
</html>
